name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [v3]
  # Allows a manual re-run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't waste CI minutes on the old versions; only v3 is built.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A stale snapshot means the Sheet was edited without re-running
      # `npm run data:sync`. This step fetches the live sheet, so it can also
      # catch a Sheet that is unreachable or unpublished — which is why it must
      # not block the deploy. The committed snapshot is the real fallback.
      - name: Check data snapshot is current
        run: npm run data:sync:check || echo "::warning::Snapshot is stale or the sheet is unreachable. Run: npm run data:sync"

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}

      # Catches broken internal links, missing alt text, duplicate h1s, and any
      # colour that escapes the monochrome palette.
      - name: Verify build output
        run: node scripts/verify-build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4